name: Checklist

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  issues:
    types: [edited, closed]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

jobs:
  checklist:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const gate = require('./.github/scripts/checklist.js');
            await gate.checkPullRequest({ github, context, core });

  rerun-linked-prs:
    if: github.event_name == 'issues' && github.event.action == 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const gate = require('./.github/scripts/checklist.js');
            await gate.rerunLinkedPullRequests({ github, context, core });

  guard-issue-close:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const gate = require('./.github/scripts/checklist.js');
            await gate.guardIssueClose({ github, context, core });
