name: CI

# Lints, builds and runs every test on each push to main and each pull request
# into main (#22). "Lint, build and test" is a required check on main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The same PostgreSQL as docker-compose.yml, for the integration tests.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    # Real environment variables, so no .env is needed (src/config/env.ts).
    # The app and the tests share the CI database; it is thrown away afterwards.
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://booking:booking@localhost:5432/booking_test
      TEST_DATABASE_URL: postgres://booking:booking@localhost:5432/booking_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails when a library the running app depends on has a known serious
      # vulnerability (docs/security.md, #85). Developer-only tools are not checked.
      - name: Check dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      # The integration tests migrated the database, so regenerating the types
      # must give the committed file. A difference means someone changed a
      # migration and forgot to run npm run db:types.
      - name: Check database types match the migrations
        run: |
          npm run db:types
          git diff --exit-code src/database/database.types.ts
