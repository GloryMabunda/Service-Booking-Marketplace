name: CI

# Lints, builds and runs every test on each push to main and each pull request
# into main (#22). "Lint, build and test" is a required check on main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The same PostgreSQL as docker-compose.yml, for the integration tests.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    # Real environment variables, so no .env is needed (src/config/env.ts).
    # The app and the tests share the CI database; it is thrown away afterwards.
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://booking:booking@localhost:5432/booking_test
      TEST_DATABASE_URL: postgres://booking:booking@localhost:5432/booking_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails when a library the running app depends on has a known serious
      # vulnerability (docs/security.md, #85). Developer-only tools are not checked.
      - name: Check dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      # The integration tests migrated the database, so regenerating the types
      # must give the committed file. A difference means someone changed a
      # migration and forgot to run npm run db:types.
      - name: Check database types match the migrations
        run: |
          npm run db:types
          git diff --exit-code src/database/database.types.ts

  # Proves the one-command demo (compose.demo.yml, docs/demo.md) really starts
  # from nothing: builds the image, migrates, adds the demo data and serves it,
  # then makes a booking and checks the email reached the demo mailbox.
  demo:
    name: The demo starts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Start the demo
        run: docker compose -f compose.demo.yml up --build -d

      - name: Wait until it answers
        run: |
          for i in $(seq 1 40); do
            if curl -fs http://localhost:3000/api/health | grep -q '"demo":true'; then exit 0; fi
            sleep 3
          done
          docker compose -f compose.demo.yml logs
          exit 1

      - name: Check the demo data and make a booking
        run: |
          services="$(curl -fs http://localhost:3000/api/services)"
          test "$(echo "$services" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(d.services.filter(s=>s.image).length)")" = "4"
          id="$(echo "$services" | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).services[0].id)")"
          day="$(node -e "const d=new Date(Date.now()+10*864e5);while([0,6].includes(d.getUTCDay()))d.setUTCDate(d.getUTCDate()+1);console.log(d.toISOString().slice(0,10))")"
          slot="$(curl -fs "http://localhost:3000/api/availability?serviceId=$id&date=$day" | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).slots[0].startAt)")"
          curl -fs -X POST http://localhost:3000/api/bookings -H 'Content-Type: application/json' \
            -d "{\"serviceId\":\"$id\",\"startAt\":\"$slot\",\"clientName\":\"CI Client\",\"clientEmail\":\"ci@example.com\",\"clientPhone\":\"082 555 0100\"}"
          sleep 3
          curl -fs http://localhost:3000/api/demo/emails | grep -q '/booking/'

      - name: Show the log if something failed
        if: failure()
        run: docker compose -f compose.demo.yml logs

      - name: Stop the demo
        if: always()
        run: docker compose -f compose.demo.yml down -v
