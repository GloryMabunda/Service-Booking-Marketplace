name: Deploy

# Deploys main to the production server after CI passes (#90, docs/deployment.md).
# It does nothing until the owner turns it on: set the repository variable
# DEPLOY_ENABLED to "true" (Settings, Secrets and variables, Variables) once the
# server and the secrets below exist.
#
# Secrets (Settings, Environments, production). None are in Git:
#   DEPLOY_HOST         the server's address
#   DEPLOY_USER         the user that owns /opt/booking
#   DEPLOY_SSH_KEY      that user's private deploy key
#   DEPLOY_KNOWN_HOSTS  the server's host key line (ssh-keyscan output), so the
#                       connection can't be sent to somewhere else
# Variable: SITE_ADDRESS, the public address (for the check after the deploy).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer one waits for the one running
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build and deploy
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI just tested, not whatever main is by now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Work out the image name
        id: image
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          repo="$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${repo}:${SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}

      # Secrets are passed as environment variables, never pasted into a script
      - name: Set up the SSH connection
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy the deploy files to the server
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            deploy/docker-compose.yml deploy/Caddyfile deploy/*.sh \
            "$TARGET:/opt/booking/"

      # Backs up, migrates, then starts the new version; stops without touching
      # the running one if the migrations fail (deploy/deploy.sh)
      - name: Deploy
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$TARGET" \
            "chmod +x /opt/booking/*.sh && /opt/booking/deploy.sh '$IMAGE'"

      - name: Check the live site
        env:
          SITE: ${{ vars.SITE_ADDRESS }}
        run: |
          sleep 5
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            "https://$SITE/api/health"
