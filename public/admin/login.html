<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sign in</title>
    <link rel="icon" type="image/png" href="/images/brand/favicon-64.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <script src="/js/brand.js" defer></script>
    <script src="/js/admin-login.js" type="module"></script>
  </head>
  <body class="mbg-hero">
    <!-- Admin login (A-1, #27). No sign-up and no "forgot password": the
         owner resets her password with npm run seed:admin. -->
    <main id="main" class="mbg-login">
      <div class="card mbg-card-raised mbg-login-card">
        <div class="card-body p-4 p-sm-5">
          <div class="text-center mb-4">
            <span data-brand-mark data-size="large"></span>
            <p class="mbg-label mt-3 mb-0">Admin portal</p>
          </div>

          <div
            id="login-error"
            class="alert alert-danger d-flex gap-2 d-none"
            role="alert"
          >
            <i class="bi bi-x-circle" aria-hidden="true"></i>
            <span id="login-error-text"></span>
          </div>

          <form id="login-form" novalidate>
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input
                class="form-control"
                id="email"
                name="email"
                type="email"
                autocomplete="username"
                required
                aria-describedby="email-error"
              />
              <div class="invalid-feedback" id="email-error"></div>
            </div>
            <div class="mb-4">
              <label class="form-label" for="password">Password</label>
              <input
                class="form-control"
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                aria-describedby="password-error"
              />
              <div class="invalid-feedback" id="password-error"></div>
            </div>
            <button
              class="btn btn-primary w-100"
              type="submit"
              id="login-button"
            >
              Sign in
            </button>
          </form>
        </div>
      </div>
      <p class="text-center small mt-4 mb-0">
        <a href="/">← Back to the website</a>
      </p>
    </main>
  </body>
</html>
