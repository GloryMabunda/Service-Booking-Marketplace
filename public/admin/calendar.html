<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Calendar</title>
    <link rel="icon" type="image/png" href="/images/brand/favicon-64.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <script src="/js/brand.js" defer></script>
    <!-- FullCalendar (A-7), pinned to an exact version and checked with its
         integrity hash -->
    <script
      src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"
      integrity="sha256-ZztCtsADLKbUFK/X6nOYnJr0eelmV2X3dhLDB/JK6fM="
      crossorigin="anonymous"
      defer
    ></script>
    <script src="/js/admin.js" type="module"></script>
    <script src="/js/admin-calendar.js" type="module"></script>
  </head>
  <body>
    <admin-header current="calendar"></admin-header>

    <!-- The calendar of appointments (A-7, #76) with /api/admin/calendar -->
    <main id="main" class="mbg-section mbg-admin-main">
      <div class="mbg-container">
        <div
          class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3"
        >
          <div>
            <p class="mbg-label mb-2">Admin portal</p>
            <h1 class="mb-0">Calendar</h1>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="include-cancelled"
            />
            <label class="form-check-label" for="include-cancelled"
              >Show cancelled and expired bookings</label
            >
          </div>
        </div>

        <div id="page-message" role="status" aria-live="polite"></div>

        <ul class="list-inline small mb-3" id="legend" aria-label="Key"></ul>

        <div id="calendar" class="mbg-admin-calendar"></div>
      </div>
    </main>
  </body>
</html>
