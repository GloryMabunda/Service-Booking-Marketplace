<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Settings · Make Up by Glory admin</title>
    <link rel="icon" type="image/png" href="/images/logo/favicon-64.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <script src="/js/admin.js" type="module"></script>
    <script src="/js/admin-settings.js" type="module"></script>
  </head>
  <body>
    <admin-header current="settings"></admin-header>

    <!-- Business settings (A-8, #75) with /api/admin/settings -->
    <main id="main" class="mbg-section mbg-admin-main">
      <div class="mbg-container mbg-narrow">
        <p class="mbg-label mb-2">Admin portal</p>
        <h1>Settings</h1>
        <p class="mbg-readable text-secondary">
          Changes apply to new bookings from now on. Bookings already made keep
          the price, deposit and deadline they were made with.
        </p>

        <div id="page-message" role="status" aria-live="polite"></div>
        <div id="loading" class="text-secondary" role="status">
          <span
            class="spinner-border spinner-border-sm me-2"
            aria-hidden="true"
          ></span
          >Loading settings…
        </div>

        <form id="settings-form" novalidate hidden></form>
      </div>
    </main>
  </body>
</html>
