<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Bookings · Make Up by Glory admin</title>
    <link rel="icon" type="image/png" href="/images/logo/favicon-64.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <script src="/js/admin.js" type="module"></script>
    <script src="/js/admin-bookings.js" type="module"></script>
  </head>
  <body>
    <admin-header current="bookings"></admin-header>

    <!-- Find and filter bookings (A-3, #63) with /api/admin/bookings -->
    <main id="main" class="mbg-section mbg-admin-main">
      <div class="mbg-container">
        <p class="mbg-label mb-2">Admin portal</p>
        <h1>Bookings</h1>

        <form class="card card-body mb-4" id="filters" novalidate>
          <div class="row g-3">
            <div class="col-12">
              <fieldset>
                <legend class="form-label fs-6">Status</legend>
                <div class="d-flex flex-wrap gap-3" id="status-checks"></div>
              </fieldset>
            </div>
            <div class="col-sm-6 col-lg-3">
              <label class="form-label" for="from">From</label>
              <input class="form-control" type="date" id="from" />
              <div class="invalid-feedback" id="from-error"></div>
            </div>
            <div class="col-sm-6 col-lg-3">
              <label class="form-label" for="to">To</label>
              <input class="form-control" type="date" id="to" />
              <div class="invalid-feedback" id="to-error"></div>
            </div>
            <div class="col-lg-6">
              <label class="form-label" for="q">Search</label>
              <input
                class="form-control"
                type="search"
                id="q"
                maxlength="100"
                placeholder="Reference, name, email or phone"
                autocomplete="off"
              />
            </div>
            <div class="col-sm-6 col-lg-4">
              <label class="form-label" for="sort">Order</label>
              <select class="form-select" id="sort">
                <option value="startAt">Appointment: soonest first</option>
                <option value="-startAt">Appointment: latest first</option>
                <option value="-createdAt">Booked: newest first</option>
                <option value="createdAt">Booked: oldest first</option>
              </select>
            </div>
            <div class="col-sm-6 col-lg-5 d-flex align-items-end">
              <div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="proof" />
                  <label class="form-check-label" for="proof"
                    >Only bookings with a proof of payment to review</label
                  >
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="refund" />
                  <label class="form-check-label" for="refund"
                    >Only refunds I still have to pay</label
                  >
                </div>
              </div>
            </div>
            <div class="col-lg-4 d-flex align-items-end gap-2">
              <button class="btn btn-primary" type="submit">
                <i class="bi bi-funnel me-1" aria-hidden="true"></i>Filter
              </button>
              <button class="btn btn-outline-primary" type="button" id="clear">
                Clear
              </button>
            </div>
          </div>
        </form>

        <div id="page-message" role="status" aria-live="polite"></div>
        <div id="loading" class="text-secondary" role="status" hidden>
          <span
            class="spinner-border spinner-border-sm me-2"
            aria-hidden="true"
          ></span
          >Loading bookings…
        </div>

        <p id="summary" class="text-secondary" aria-live="polite"></p>

        <div class="table-responsive" id="table-wrap" hidden>
          <table class="table align-middle">
            <thead>
              <tr>
                <th scope="col">Reference</th>
                <th scope="col">Client</th>
                <th scope="col">Service</th>
                <th scope="col">When</th>
                <th scope="col">Status</th>
                <th scope="col">Payment</th>
              </tr>
            </thead>
            <tbody id="bookings-body"></tbody>
          </table>
        </div>
        <p id="no-results" class="text-secondary" hidden>
          No bookings match. Try clearing the filters.
        </p>

        <nav aria-label="Pages" id="pager" hidden>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-primary" type="button" id="prev">
              <i class="bi bi-chevron-left" aria-hidden="true"></i> Previous
            </button>
            <button class="btn btn-outline-primary" type="button" id="next">
              Next <i class="bi bi-chevron-right" aria-hidden="true"></i>
            </button>
          </div>
        </nav>
      </div>
    </main>
  </body>
</html>
