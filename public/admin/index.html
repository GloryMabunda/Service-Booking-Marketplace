<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Admin portal · Make Up by Glory</title>
    <link rel="icon" type="image/png" href="/images/logo/favicon-64.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <script src="/js/admin.js" type="module"></script>
    <script type="module">
      import { currentUser } from '/js/admin.js';
      currentUser.then((user) => {
        document.querySelector('#welcome-email').textContent = user.email;
      });
    </script>
  </head>
  <body>
    <admin-header></admin-header>

    <!-- Portal home (#27). The dashboard (A-2) replaces this in M6. -->
    <main id="main" class="mbg-section mbg-admin-main">
      <div class="mbg-container">
        <p class="mbg-label mb-2">Admin portal</p>
        <h1>Welcome back</h1>
        <p class="mbg-readable">
          You're signed in as <strong id="welcome-email">…</strong>. Your
          session lasts 12 hours without activity, and 7 days at most.
        </p>

        <div class="mt-4">
          <a class="btn btn-primary" href="/admin/services.html">
            <i class="bi bi-scissors me-1" aria-hidden="true"></i>Manage
            services
          </a>
        </div>

        <div class="alert alert-info d-flex gap-2 mt-4" role="status">
          <i class="bi bi-info-circle" aria-hidden="true"></i>
          <span>
            The dashboard, bookings and settings will appear here as they're
            built.
          </span>
        </div>
      </div>
    </main>
  </body>
</html>
