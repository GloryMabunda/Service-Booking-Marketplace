<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Dashboard</title>
    <link rel="icon" type="image/png" href="/images/brand/favicon-64.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <script src="/js/brand.js" defer></script>
    <script src="/js/admin.js" type="module"></script>
    <script src="/js/admin-dashboard.js" type="module"></script>
  </head>
  <body>
    <admin-header current="dashboard"></admin-header>

    <!-- The dashboard (A-2, #62) with /api/admin/dashboard -->
    <main id="main" class="mbg-section mbg-admin-main">
      <div class="mbg-container">
        <p class="mbg-label mb-2">Admin portal</p>
        <h1>Dashboard</h1>

        <div id="page-message" role="status" aria-live="polite"></div>

        <div id="loading" class="text-secondary" role="status">
          <span
            class="spinner-border spinner-border-sm me-2"
            aria-hidden="true"
          ></span
          >Loading…
        </div>

        <div id="content" hidden>
          <div class="row g-3 mb-4" id="figures"></div>

          <h2 class="h4">Upcoming appointments</h2>
          <div class="table-responsive" id="upcoming-wrap" hidden>
            <table class="table align-middle">
              <thead>
                <tr>
                  <th scope="col">When</th>
                  <th scope="col">Client</th>
                  <th scope="col">Service</th>
                  <th scope="col">Status</th>
                  <th scope="col">Reference</th>
                </tr>
              </thead>
              <tbody id="upcoming-body"></tbody>
            </table>
          </div>
          <p id="no-upcoming" class="text-secondary" hidden>
            No upcoming appointments yet. New bookings appear here.
          </p>

          <div class="mt-4">
            <a class="btn btn-primary" href="/admin/bookings.html">
              <i class="bi bi-journal-text me-1" aria-hidden="true"></i>All
              bookings
            </a>
            <a class="btn btn-outline-primary ms-2" href="/admin/services.html">
              <i class="bi bi-brush me-1" aria-hidden="true"></i>Services
            </a>
            <a
              class="btn btn-outline-primary ms-2"
              href="/admin/availability.html"
            >
              <i class="bi bi-calendar-week me-1" aria-hidden="true"></i>Working
              hours
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
