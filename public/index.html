<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Make Up by Glory</title>
    <meta
      name="description"
      content="Book makeup appointments with Make Up by Glory online."
    />
    <link rel="icon" type="image/png" href="/images/logo/favicon-64.png" />

    <!-- Every page loads these in this order: Bootstrap, its icons, the brand tokens, the site layout (#23). -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <script src="/js/layout.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body>
    <site-header></site-header>

    <main id="main">
      <!-- Placeholder home page. The real content (About, services, gallery,
           testimonials, booking info, contact) comes from /api/site in M2. -->
      <section class="mbg-hero mbg-section">
        <div class="mbg-container text-center">
          <img
            class="mbg-hero-logo mb-4"
            src="/images/logo/logo-600.png"
            alt="Make Up by Glory"
            width="320"
            height="320"
          />
          <h1 class="mbg-hero-title">Makeup for every occasion</h1>
          <p class="mbg-readable mx-auto mb-4">
            Soft glam, bridal and special-event makeup. Choose a service, pick a
            time that suits you and secure it with a deposit.
          </p>
          <a class="btn btn-book btn-lg" href="/services.html">
            <i class="bi bi-calendar-heart me-2" aria-hidden="true"></i>Book now
          </a>
        </div>
      </section>

      <section class="mbg-section">
        <div class="mbg-container">
          <div class="alert alert-info d-flex gap-2 mb-0" role="status">
            <i class="bi bi-info-circle" aria-hidden="true"></i>
            <span>
              Online booking is coming soon. In the meantime, please get in
              touch to book your appointment.
            </span>
          </div>
        </div>
      </section>
    </main>

    <site-footer></site-footer>
  </body>
</html>
