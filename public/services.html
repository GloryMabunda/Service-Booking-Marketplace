<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Services</title>
    <meta name="description" content="Services, prices and deposits." />
    <link rel="icon" type="image/png" href="/images/brand/favicon-64.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/site.css" />
    <script src="/js/brand.js" defer></script>
    <script src="/js/layout.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
      defer
    ></script>
    <script src="/js/services-page.js" type="module"></script>
  </head>
  <body>
    <site-header current="services"></site-header>

    <!-- The service list (C-1, #32), loaded from GET /api/services. -->
    <main id="main" class="mbg-section">
      <div class="mbg-container">
        <p class="mbg-label mb-2">Services</p>
        <h1>Choose a service</h1>
        <p id="deposit-note" class="mbg-readable text-secondary" hidden></p>

        <div id="services-loading" class="text-secondary" role="status">
          <span
            class="spinner-border spinner-border-sm me-2"
            aria-hidden="true"
          ></span
          >Loading services…
        </div>

        <div
          id="services-error"
          class="alert alert-danger d-none gap-2"
          role="alert"
        >
          <i class="bi bi-x-circle" aria-hidden="true"></i>
          <span
            >We couldn't load the services. Please refresh the page or try again
            in a moment.</span
          >
        </div>

        <div id="services-empty" class="alert alert-info d-none gap-2">
          <i class="bi bi-info-circle" aria-hidden="true"></i>
          <span id="services-empty-text"></span>
        </div>

        <div id="services-list" class="row g-4 mt-1"></div>

        <div id="business-info" class="mt-5" hidden>
          <h2 class="h3">Questions?</h2>
          <p class="mb-1">
            <strong id="business-name"></strong>
          </p>
          <ul class="list-unstyled mb-0">
            <li>
              <i class="bi bi-envelope me-2" aria-hidden="true"></i>
              <a id="business-email" href="#"></a>
            </li>
            <li id="business-phone-row" hidden>
              <i class="bi bi-telephone me-2" aria-hidden="true"></i>
              <a id="business-phone" href="#"></a>
            </li>
          </ul>
        </div>
      </div>
    </main>

    <site-footer></site-footer>
  </body>
</html>
